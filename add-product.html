<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Добавить продукт — ДоброРядом</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✳</span><span>добро<span class="brand-accent">рядом</span><small>ФУДШЕРИНГ ДЛЯ СЕЛА</small></span></a><nav><a href="index.html">Главная</a><a href="catalog.html">Каталог</a></nav><div class="header-actions"><a class="text-link" href="profile.html">Личный кабинет</a></div></header><main class="wrap page-main form-page"><a class="back-link" href="profile.html">← Назад в кабинет</a><div class="page-intro"><span class="eyebrow">ПОДЕЛИТЕСЬ УРОЖАЕМ</span><h1>Новое предложение</h1><p>Расскажите, какие продукты вы готовы отдать бесплатно.</p></div><form class="listing-form" id="product-form"><div class="form-grid"><label>Название продукта<input name="name" placeholder="Например, свежая морковь" required></label><label>Категория<select name="category"><option>Овощи</option><option>Фрукты</option><option>Молочные продукты</option><option>Другое</option></select></label><label>Количество<input name="quantity" placeholder="Например, 5 кг" required></label><label>Годен до<input name="expiry" type="date" required></label><label class="wide">Место передачи<input name="location" placeholder="Населённый пункт, улица" required></label><label class="wide">Описание<textarea name="description" rows="4" placeholder="Состояние продуктов, удобное время передачи..."></textarea></label><label class="wide">Ссылка на фото (необязательно)<input name="image" type="url" placeholder="https://..."></label></div><div class="form-actions"><button class="btn" type="submit">Опубликовать объявление <span>→</span></button><a class="text-link" href="profile.html">Отмена</a></div><p class="form-message" id="form-message"></p></form></main><script src="js/data.js"></script><script src="js/app.js"
